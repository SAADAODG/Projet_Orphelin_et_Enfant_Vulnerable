# Analyse SonarQube du projet OEV
#
# Avant l'analyse, produire la couverture des tests (coverage.xml) avec PCOV ou Xdebug, par exemple :
#   php -d extension=pcov -d pcov.enabled=1 -d pcov.directory=app vendor/bin/phpunit --coverage-clover coverage.xml
#   php -d zend_extension=xdebug -d xdebug.mode=coverage vendor/bin/phpunit --coverage-clover coverage.xml
# puis lancer sonar-scanner depuis la racine du projet.

# Clé et nom du projet tels qu'ils sont déclarés dans SonarQube
sonar.projectKey=oev
sonar.projectName=OEV
sonar.sourceEncoding=UTF-8

sonar.sources=app,resources,routes,public/assets,config,database
sonar.tests=tests
sonar.php.coverage.reportPaths=coverage.xml

# Bibliothèques tierces et scripts de mesure de performance : hors analyse
sonar.exclusions=public/assets/vendors/**,scripts/perf/**
# Données de référence (seeders) et configuration Laravel : hors détection de duplication
sonar.cpd.exclusions=database/seeders/**,config/**,database/factories/**
#sonar.exclusions=database/seeders/**,database/factories/**
