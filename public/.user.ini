; Rapport ANSSI du 17/11/2026, Vul-001 « Nombre de variables d'entrée PHP dépassé » :
; erreurs, avertissements et notifications jamais affichés, toujours journalisés.
; Lu par PHP-FPM / CGI (en module Apache, c'est public/.htaccess). Le php.ini du
; serveur doit porter les mêmes valeurs, plus expose_php = Off (non modifiable ici).
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
